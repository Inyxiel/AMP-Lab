name: Validate AMP Lab Repository

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify current version
        shell: bash
        run: |
          test "$(tr -d '\r\n' < VERSION)" = "8.0.0"

      - name: Validate legacy recovery tool syntax
        run: python -m py_compile tools/extract_v748_frontend.py

      - name: Reject private or third-party development inputs
        shell: bash
        run: |
          bad=$(git ls-files | grep -Ei '(^|/)([^/]*\.pak|[^/]*\.lsv|\.env($|\.)|amp_lab_runtime_snapshot\.json|amp_lab_app_sync\.json|amp_lab_bridge_status\.json|ampis_full_details.*\.json|AMP Items & Shards.*\.xlsx)$' || true)
          if [ -n "$bad" ]; then
            echo "Forbidden development inputs are tracked:"
            echo "$bad"
            exit 1
          fi

      - name: Verify v8.0.0 release checksum declaration
        shell: bash
        run: |
          grep -q '^bee3bd10c42dc0d3f5019471bf6aaecd12e9f470755f87bdb840cdf90f36d556  AMP_Lab_v8.0.0.exe$' checksums/AMP_Lab_v8.0.0.sha256

      - name: Preserve verified v7.4.8 recovery baseline declaration
        shell: bash
        run: |
          grep -q 'b4367fc3ab6c46123c31b19d2f795e5b765e079179d618b954dcc19ca1ccd571  AMP20Lab_v7.4.8_Raw-Arsenal-Direct-Shards.exe' checksums/SHA256SUMS.txt

      - name: Ensure obsolete v7.3.5 recovery files are gone
        shell: bash
        run: |
          test ! -e tools/extract_v735_frontend.py
          test ! -e docs/V7.3.5_BASELINE.md
