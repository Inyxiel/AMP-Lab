name: Publish Windows Release

# Automatic tag publishing will be enabled once the real AMP Lab source/build command
# is added to this repository. For now this workflow is manual-only so tags cannot
# accidentally trigger a broken release.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Source/build setup required
        shell: pwsh
        run: |
          Write-Host "AMP Lab repository initialized successfully."
          Write-Host "Automatic EXE publishing will be enabled after the actual source/build files are added."
          Write-Host "Expected final flow: tag vX.Y.Z -> Windows build -> GitHub Release -> EXE asset."
