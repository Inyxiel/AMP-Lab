name: Prepare Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - 'release-draft/**'

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify v8.0.0 release metadata
        shell: bash
        run: |
          test "$(tr -d '\r\n' < VERSION)" = '8.0.0'
          grep -q '^bee3bd10c42dc0d3f5019471bf6aaecd12e9f470755f87bdb840cdf90f36d556  AMP_Lab_v8.0.0.exe$' checksums/AMP_Lab_v8.0.0.sha256
          test -f docs/RELEASE_NOTES_v8.0.0.md

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v8.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v8.0.0 release already exists; leaving it unchanged.'
          else
            gh release create v8.0.0 \
              --repo "$GITHUB_REPOSITORY" \
              --target main \
              --title 'AMP Lab v8.0.0' \
              --notes-file docs/RELEASE_NOTES_v8.0.0.md \
              --draft
          fi

      - name: Remove temporary trigger branch
        if: startsWith(github.ref_name, 'release-draft/')
        shell: bash
        run: git push origin --delete "$GITHUB_REF_NAME"
