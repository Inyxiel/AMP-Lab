name: Publish Windows Release

# v7.3.5 is the only accepted baseline for this repository.
# Automatic EXE building is intentionally disabled until the v7.3.5 Go backend
# has been reconstructed and validated. Do not substitute older source snapshots.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-readiness:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm current baseline
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -ne "7.3.5") {
            throw "Unexpected AMP Lab baseline: $version"
          }
          Write-Host "AMP Lab baseline: v$version Tooltip Restore Fix"
          Write-Host "Automatic EXE build/release remains disabled until the v7.3.5 backend is reproducible."
